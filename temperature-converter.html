<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Temperature Converter - ToolSathi</title>
  <meta name="description" content="Free online Temperature Converter. Convert Celsius, Fahrenheit and Kelvin quickly and easily with ToolSathi.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      background: #eef4ff;
      border-radius: 8px;
      line-height: 1.8;
      font-size: 17px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }

    @media (max-width: 500px) {
      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online Temperature Converter</p>
</header>

<div class="container">
  <div class="card">

    <h2>Temperature Converter</h2>

    <label for="value">Enter Temperature</label>
    <input
      type="number"
      id="value"
      placeholder="Example: 100"
      step="any"
    >

    <div class="row">

      <div>
        <label for="fromUnit">From</label>
        <select id="fromUnit">
          <option value="celsius">Celsius (°C)</option>
          <option value="fahrenheit">Fahrenheit (°F)</option>
          <option value="kelvin">Kelvin (K)</option>
        </select>
      </div>

      <div>
        <label for="toUnit">To</label>
        <select id="toUnit">
          <option value="celsius">Celsius (°C)</option>
          <option value="fahrenheit">Fahrenheit (°F)</option>
          <option value="kelvin">Kelvin (K)</option>
        </select>
      </div>

    </div>

    <button onclick="convertTemperature()">
      Convert
    </button>

    <div class="result" id="result">
      Result will appear here
    </div>

  </div>
</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>
  function convertTemperature() {

    const value = parseFloat(
      document.getElementById("value").value
    );

    const fromUnit =
      document.getElementById("fromUnit").value;

    const toUnit =
      document.getElementById("toUnit").value;

    const resultBox =
      document.getElementById("result");

    if (!Number.isFinite(value)) {
      resultBox.innerHTML =
        "Please enter a valid temperature.";
      return;
    }

    let celsius;

    // Convert the input to Celsius first.
    if (fromUnit === "celsius") {
      celsius = value;
    } else if (fromUnit === "fahrenheit") {
      celsius = (value - 32) * 5 / 9;
    } else if (fromUnit === "kelvin") {
      celsius = value - 273.15;
    }

    let result;

    // Convert Celsius to the selected unit.
    if (toUnit === "celsius") {
      result = celsius;
    } else if (toUnit === "fahrenheit") {
      result = (celsius * 9 / 5) + 32;
    } else if (toUnit === "kelvin") {
      result = celsius + 273.15;
    }

    const symbols = {
      celsius: "°C",
      fahrenheit: "°F",
      kelvin: "K"
    };

    resultBox.innerHTML = `
      ${value} ${symbols[fromUnit]} =
      <strong>${result.toFixed(4)} ${symbols[toUnit]}</strong>
    `;
  }
</script>

</body>
</html>
