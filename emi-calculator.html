<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EMI Calculator - ToolSathi</title>
  <meta name="description" content="Free online EMI Calculator. Calculate monthly loan EMI, total interest and total payment easily with ToolSathi.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      background: #eef4ff;
      border-radius: 8px;
      line-height: 1.8;
      font-size: 17px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online EMI Calculator</p>
</header>

<div class="container">
  <div class="card">

    <h2>EMI Calculator</h2>

    <label for="loan">Loan Amount (₹)</label>
    <input
      type="number"
      id="loan"
      placeholder="Example: 500000"
    >

    <label for="rate">Annual Interest Rate (%)</label>
    <input
      type="number"
      id="rate"
      step="0.01"
      placeholder="Example: 8.5"
    >

    <label for="years">Loan Tenure (Years)</label>
    <input
      type="number"
      id="years"
      placeholder="Example: 5"
    >

    <button onclick="calculateEMI()">
      Calculate EMI
    </button>

    <div class="result" id="result">
      Result will appear here
    </div>

  </div>
</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>
  function calculateEMI() {

    const loan = parseFloat(
      document.getElementById("loan").value
    );

    const annualRate = parseFloat(
      document.getElementById("rate").value
    );

    const years = parseFloat(
      document.getElementById("years").value
    );

    const resultBox = document.getElementById("result");

    if (
      isNaN(loan) ||
      isNaN(annualRate) ||
      isNaN(years) ||
      loan <= 0 ||
      annualRate < 0 ||
      years <= 0
    ) {
      resultBox.innerHTML =
        "Please enter valid loan details.";
      return;
    }

    const months = years * 12;
    const monthlyRate = annualRate / 12 / 100;

    let emi;

    if (monthlyRate === 0) {
      emi = loan / months;
    } else {
      emi =
        loan *
        monthlyRate *
        Math.pow(1 + monthlyRate, months) /
        (Math.pow(1 + monthlyRate, months) - 1);
    }

    const totalPayment = emi * months;
    const totalInterest = totalPayment - loan;

    resultBox.innerHTML = `
      Loan Amount: ₹${loan.toFixed(2)}<br>
      Monthly EMI: <strong>₹${emi.toFixed(2)}</strong><br>
      Total Interest: ₹${totalInterest.toFixed(2)}<br>
      <strong>Total Payment: ₹${totalPayment.toFixed(2)}</strong>
    `;
  }
</script>

</body>
</html>
