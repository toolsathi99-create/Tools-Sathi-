<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Day of Week Calculator - ToolSathi</title>

  <meta
    name="description"
    content="Free online Day of Week Calculator. Find the day of the week for any date quickly with ToolSathi."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="date"] {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .clear {
      background: #555;
    }

    .clear:hover {
      background: #333;
    }

    .result {
      margin-top: 20px;
      padding: 22px;
      background: #eef4ff;
      border-radius: 10px;
      text-align: center;
      line-height: 1.7;
    }

    .day {
      display: block;
      font-size: 30px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 5px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online Day of Week Calculator</p>
</header>

<div class="container">

  <div class="card">

    <h2>Day of Week Calculator</h2>

    <label for="dateInput">
      Select a Date
    </label>

    <input
      type="date"
      id="dateInput"
    >

    <button onclick="findDay()">
      Find Day
    </button>

    <button class="clear" onclick="clearDate()">
      Clear
    </button>

    <div class="result" id="result">
      Select a date to find the day of the week.
    </div>

  </div>

</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>

  function findDay() {

    const value =
      document.getElementById("dateInput").value;

    const result =
      document.getElementById("result");

    if (!value) {

      result.innerHTML =
        "Please select a date.";

      return;
    }

    /*
      Use UTC so the selected calendar date
      is not shifted by the device timezone.
    */

    const date =
      new Date(value + "T00:00:00Z");

    const days = [
      "Sunday",
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday"
    ];

    const dayName =
      days[date.getUTCDay()];

    const formattedDate =
      date.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "long",
        year: "numeric",
        timeZone: "UTC"
      });

    result.innerHTML = `
      <span class="day">${dayName}</span>
      ${formattedDate}
    `;
  }


  function clearDate() {

    document.getElementById("dateInput").value = "";

    document.getElementById("result").innerHTML =
      "Select a date to find the day of the week.";
  }

</script>

</body>
</html>
