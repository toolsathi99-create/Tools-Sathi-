<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CGPA to Percentage Calculator - ToolSathi</title>
  <meta name="description" content="Free online CGPA to Percentage Calculator. Convert CGPA into percentage quickly and easily with ToolSathi.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .info {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      background: #eef4ff;
      border-radius: 8px;
      line-height: 1.8;
      font-size: 18px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online CGPA to Percentage Calculator</p>
</header>

<div class="container">
  <div class="card">

    <h2>CGPA to Percentage</h2>

    <div class="info">
      Common formula used here:<br>
      <strong>Percentage = CGPA × 9.5</strong>
    </div>

    <label for="cgpa">Enter CGPA</label>

    <input
      type="number"
      id="cgpa"
      placeholder="Example: 8.5"
      step="0.01"
      min="0"
      max="10"
    >

    <button onclick="convertCGPA()">
      Convert to Percentage
    </button>

    <div class="result" id="result">
      Result will appear here
    </div>

  </div>
</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>
  function convertCGPA() {

    const cgpa = parseFloat(
      document.getElementById("cgpa").value
    );

    const resultBox = document.getElementById("result");

    if (isNaN(cgpa) || cgpa < 0 || cgpa > 10) {
      resultBox.innerHTML =
        "Please enter CGPA between 0 and 10.";
      return;
    }

    const percentage = cgpa * 9.5;

    resultBox.innerHTML = `
      CGPA: <strong>${cgpa.toFixed(2)}</strong><br>
      Percentage: <strong>${percentage.toFixed(2)}%</strong>
    `;
  }
</script>

</body>
</html>
