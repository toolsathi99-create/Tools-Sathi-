<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GST Calculator - ToolSathi</title>
  <meta name="description" content="Free online GST Calculator. Calculate GST amount, CGST, SGST and final price quickly with ToolSathi.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      background: #eef4ff;
      border-radius: 8px;
      line-height: 1.8;
      font-size: 17px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online GST Calculator</p>
</header>

<div class="container">
  <div class="card">

    <h2>GST Calculator</h2>

    <label for="amount">Amount (₹)</label>
    <input
      type="number"
      id="amount"
      placeholder="Example: 1000"
    >

    <label for="gst">GST Rate (%)</label>
    <select id="gst">
      <option value="5">5%</option>
      <option value="12">12%</option>
      <option value="18" selected>18%</option>
      <option value="28">28%</option>
    </select>

    <button onclick="calculateGST()">Calculate GST</button>

    <div class="result" id="result">
      Result will appear here
    </div>

  </div>
</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>
  function calculateGST() {

    const amount = parseFloat(
      document.getElementById("amount").value
    );

    const gstRate = parseFloat(
      document.getElementById("gst").value
    );

    const resultBox = document.getElementById("result");

    if (isNaN(amount) || amount < 0) {
      resultBox.innerHTML =
        "Please enter a valid amount.";
      return;
    }

    const gstAmount = (amount * gstRate) / 100;
    const cgst = gstAmount / 2;
    const sgst = gstAmount / 2;
    const total = amount + gstAmount;

    resultBox.innerHTML = `
      Amount: ₹${amount.toFixed(2)}<br>
      GST Rate: ${gstRate}%<br>
      GST Amount: ₹${gstAmount.toFixed(2)}<br>
      CGST: ₹${cgst.toFixed(2)}<br>
      SGST: ₹${sgst.toFixed(2)}<br>
      <strong>Total Amount: ₹${total.toFixed(2)}</strong>
    `;
  }
</script>

</body>
</html>
