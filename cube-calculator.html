<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cube Calculator - ToolSathi</title>
  <meta name="description" content="Free online Cube Calculator. Calculate the cube of any number quickly and easily with ToolSathi.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      background: #eef4ff;
      border-radius: 8px;
      line-height: 1.8;
      font-size: 17px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online Cube Calculator</p>
</header>

<div class="container">
  <div class="card">

    <h2>Cube Calculator</h2>

    <label for="number">Enter a Number</label>

    <input
      type="number"
      id="number"
      placeholder="Example: 5"
    >

    <button onclick="calculateCube()">
      Calculate Cube
    </button>

    <div class="result" id="result">
      Result will appear here
    </div>

  </div>
</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>
  function calculateCube() {

    const number = parseFloat(
      document.getElementById("number").value
    );

    const resultBox = document.getElementById("result");

    if (isNaN(number)) {
      resultBox.innerHTML =
        "Please enter a valid number.";
      return;
    }

    const cube = number * number * number;

    resultBox.innerHTML = `
      Number: ${number}<br>
      <strong>Cube: ${cube}</strong>
    `;
  }
</script>

</body>
</html>
