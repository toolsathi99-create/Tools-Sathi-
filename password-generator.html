<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Password Generator - ToolSathi</title>

  <meta
    name="description"
    content="Free online Password Generator. Generate random passwords with letters, numbers and symbols using ToolSathi."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 650px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .password-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    #password {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      font-family: monospace;
      background: #f8fafc;
    }

    .copy-btn {
      width: auto;
      margin: 0;
      padding: 12px 16px;
    }

    .length-box {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="number"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .option {
      margin: 12px 0;
      font-size: 16px;
    }

    .option input {
      margin-right: 8px;
      transform: scale(1.2);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .copy-btn {
      background: #16a34a;
    }

    .copy-btn:hover {
      background: #15803d;
    }

    .clear {
      background: #555;
    }

    .clear:hover {
      background: #333;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      min-height: 22px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }

    @media (max-width: 500px) {
      .password-box {
        flex-direction: column;
      }

      .copy-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online Password Generator</p>
</header>

<div class="container">

  <div class="card">

    <h2>Password Generator</h2>

    <div class="password-box">

      <input
        type="text"
        id="password"
        readonly
        placeholder="Your password will appear here"
      >

      <button
        class="copy-btn"
        onclick="copyPassword()"
      >
        Copy
      </button>

    </div>

    <div class="length-box">

      <label for="length">
        Password Length
      </label>

      <input
        type="number"
        id="length"
        value="12"
        min="4"
        max="100"
      >

    </div>

    <div class="option">
      <label>
        <input
          type="checkbox"
          id="uppercase"
          checked
        >
        Include Uppercase Letters (A-Z)
      </label>
    </div>

    <div class="option">
      <label>
        <input
          type="checkbox"
          id="lowercase"
          checked
        >
        Include Lowercase Letters (a-z)
      </label>
    </div>

    <div class="option">
      <label>
        <input
          type="checkbox"
          id="numbers"
          checked
        >
        Include Numbers (0-9)
      </label>
    </div>

    <div class="option">
      <label>
        <input
          type="checkbox"
          id="symbols"
          checked
        >
        Include Symbols
      </label>
    </div>

    <button onclick="generatePassword()">
      Generate Password
    </button>

    <button
      class="clear"
      onclick="clearPassword()"
    >
      Clear
    </button>

    <div
      class="message"
      id="message"
    ></div>

  </div>

</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>

  function randomCharacter(characters) {

    const array =
      new Uint32Array(1);

    crypto.getRandomValues(array);

    return characters[
      array[0] % characters.length
    ];
  }


  function generatePassword() {

    const length =
      Number(document.getElementById("length").value);

    const uppercase =
      document.getElementById("uppercase").checked;

    const lowercase =
      document.getElementById("lowercase").checked;

    const numbers =
      document.getElementById("numbers").checked;

    const symbols =
      document.getElementById("symbols").checked;

    const message =
      document.getElementById("message");

    if (
      !Number.isInteger(length) ||
      length < 4 ||
      length > 100
    ) {

      message.textContent =
        "Password length must be between 4 and 100.";

      return;
    }

    let characters = "";

    if (uppercase) {
      characters += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    }

    if (lowercase) {
      characters += "abcdefghijklmnopqrstuvwxyz";
    }

    if (numbers) {
      characters += "0123456789";
    }

    if (symbols) {
      characters += "!@#$%^&*()_+-=[]{}|;:,.<>?";
    }

    if (characters.length === 0) {

      message.textContent =
        "Please select at least one option.";

      return;
    }

    let password = "";

    for (let i = 0; i < length; i++) {

      password +=
        randomCharacter(characters);
    }

    document.getElementById("password").value =
      password;

    message.textContent =
      "Password generated successfully.";
  }


  async function copyPassword() {

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");

    if (!password) {

      message.textContent =
        "Generate a password first.";

      return;
    }

    try {

      await navigator.clipboard.writeText(password);

      message.textContent =
        "Password copied to clipboard.";

    } catch (error) {

      message.textContent =
        "Copy failed. Please copy the password manually.";
    }
  }


  function clearPassword() {

    document.getElementById("password").value = "";

    document.getElementById("length").value = 12;

    document.getElementById("uppercase").checked = true;
    document.getElementById("lowercase").checked = true;
    document.getElementById("numbers").checked = true;
    document.getElementById("symbols").checked = true;

    document.getElementById("message").textContent = "";
  }

</script>

</body>
</html>
