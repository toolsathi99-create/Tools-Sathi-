<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Binary to Hex Converter - ToolSathi</title>

  <meta
    name="description"
    content="Free online Binary to Hexadecimal Converter. Convert binary numbers to hexadecimal quickly with ToolSathi."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .info {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
      font-size: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 17px;
      font-family: monospace;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .clear {
      background: #555;
    }

    .clear:hover {
      background: #333;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      background: #eef4ff;
      border-radius: 10px;
      text-align: center;
      line-height: 1.7;
    }

    .result strong {
      display: block;
      font-size: 32px;
      color: #2563eb;
      margin-top: 5px;
      word-break: break-all;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online Binary to Hex Converter</p>
</header>

<div class="container">

  <div class="card">

    <h2>Binary to Hexadecimal</h2>

    <div class="info">
      Enter a binary number containing only 0 and 1.
    </div>

    <label for="binaryInput">
      Binary Number
    </label>

    <input
      type="text"
      id="binaryInput"
      placeholder="Example: 11111111"
      inputmode="numeric"
      onkeydown="handleEnter(event)"
    >

    <button onclick="convertToHex()">
      Convert to Hex
    </button>

    <button
      class="clear"
      onclick="clearFields()"
    >
      Clear
    </button>

    <div class="result" id="result">
      Hexadecimal result will appear here.
    </div>

  </div>

</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>

  function convertToHex() {

    const input =
      document.getElementById("binaryInput").value.trim();

    const result =
      document.getElementById("result");

    if (input === "") {

      result.innerHTML =
        "Please enter a binary number.";

      return;
    }

    // Binary can contain only 0 and 1.
    if (!/^[01]+$/.test(input)) {

      result.innerHTML =
        "Invalid binary number. Use only 0 and 1.";

      return;
    }

    const decimal =
      BigInt("0b" + input);

    const hex =
      decimal.toString(16).toUpperCase();

    result.innerHTML = `
      Binary: ${input}
      <strong>${hex}</strong>
      Hexadecimal
    `;
  }


  function handleEnter(event) {

    if (event.key === "Enter") {
      convertToHex();
    }
  }


  function clearFields() {

    document.getElementById("binaryInput").value = "";

    document.getElementById("result").innerHTML =
      "Hexadecimal result will appear here.";
  }

</script>

</body>
  </html>
