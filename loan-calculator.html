<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Loan Calculator - ToolSathi</title>

  <meta
    name="description"
    content="Free online Loan Calculator. Calculate monthly EMI, total interest and total loan payment easily with ToolSathi."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 650px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .clear {
      background: #555;
      margin-top: 12px;
    }

    .clear:hover {
      background: #333;
    }

    .result {
      margin-top: 22px;
      padding: 20px;
      background: #eef4ff;
      border-radius: 10px;
    }

    .result h3 {
      text-align: center;
      margin-top: 0;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #dbe4f0;
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .emi {
      font-size: 23px;
      color: #2563eb;
    }

    .note {
      margin-top: 18px;
      text-align: center;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online Loan Calculator</p>
</header>

<div class="container">

  <div class="card">

    <h2>Loan Calculator</h2>

    <div class="input-group">
      <label for="loanAmount">
        Loan Amount (₹)
      </label>

      <input
        type="number"
        id="loanAmount"
        placeholder="Example: 500000"
        min="1"
        step="1"
      >
    </div>

    <div class="input-group">
      <label for="interestRate">
        Annual Interest Rate (%)
      </label>

      <input
        type="number"
        id="interestRate"
        placeholder="Example: 10"
        min="0"
        step="0.01"
      >
    </div>

    <div class="input-group">
      <label for="loanYears">
        Loan Tenure (Years)
      </label>

      <input
        type="number"
        id="loanYears"
        placeholder="Example: 5"
        min="1"
        step="1"
      >
    </div>

    <button onclick="calculateLoan()">
      Calculate Loan
    </button>

    <button
      class="clear"
      onclick="clearFields()"
    >
      Clear
    </button>

    <div class="result">

      <h3>Loan Result</h3>

      <div class="result-row">
        <span>Monthly EMI</span>
        <strong class="emi" id="emi">₹0</strong>
      </div>

      <div class="result-row">
        <span>Total Interest</span>
        <strong id="interest">₹0</strong>
      </div>

      <div class="result-row">
        <span>Total Payment</span>
        <strong id="totalPayment">₹0</strong>
      </div>

    </div>

    <div class="note">
      This calculator provides an estimate based on the
      loan amount, interest rate and tenure entered.
    </div>

  </div>

</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>

  function formatRupees(value) {
    return "₹" + Math.round(value).toLocaleString("en-IN");
  }


  function calculateLoan() {

    const principal =
      Number(
        document.getElementById("loanAmount").value
      );

    const annualRate =
      Number(
        document.getElementById("interestRate").value
      );

    const years =
      Number(
        document.getElementById("loanYears").value
      );


    if (
      !principal ||
      principal <= 0 ||
      annualRate < 0 ||
      !years ||
      years <= 0
    ) {

      alert(
        "Please enter valid loan details."
      );

      return;
    }


    const months =
      years * 12;


    const monthlyRate =
      annualRate / 100 / 12;


    let emi;


    if (monthlyRate === 0) {

      emi =
        principal / months;

    } else {

      emi =
        principal *
        monthlyRate *
        Math.pow(1 + monthlyRate, months)
        /
        (
          Math.pow(1 + monthlyRate, months) - 1
        );
    }


    const totalPayment =
      emi * months;

    const totalInterest =
      totalPayment - principal;


    document.getElementById("emi").textContent =
      formatRupees(emi);

    document.getElementById("interest").textContent =
      formatRupees(totalInterest);

    document.getElementById("totalPayment").textContent =
      formatRupees(totalPayment);
  }


  function clearFields() {

    document.getElementById("loanAmount").value = "";

    document.getElementById("interestRate").value = "";

    document.getElementById("loanYears").value = "";

    document.getElementById("emi").textContent =
      "₹0";

    document.getElementById("interest").textContent =
      "₹0";

    document.getElementById("totalPayment").textContent =
      "₹0";
  }

</script>

</body>
</html>
