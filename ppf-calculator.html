<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PPF Calculator - ToolSathi</title>

  <meta
    name="description"
    content="Free online PPF Calculator. Calculate PPF investment, interest earned and maturity amount easily with ToolSathi."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 650px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .info {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .clear {
      background: #555;
      margin-top: 12px;
    }

    .clear:hover {
      background: #333;
    }

    .result {
      margin-top: 22px;
      padding: 20px;
      background: #eef4ff;
      border-radius: 10px;
    }

    .result h3 {
      text-align: center;
      margin-top: 0;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #dbe4f0;
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .maturity {
      font-size: 23px;
      color: #2563eb;
    }

    .note {
      margin-top: 18px;
      text-align: center;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online PPF Calculator</p>
</header>

<div class="container">

  <div class="card">

    <h2>PPF Calculator</h2>

    <div class="info">
      Calculate estimated PPF investment, interest earned and maturity amount.
    </div>

    <div class="input-group">
      <label for="investment">
        Yearly Investment (₹)
      </label>

      <input
        type="number"
        id="investment"
        placeholder="Example: 50000"
        min="1"
        step="1"
      >
    </div>

    <div class="input-group">
      <label for="rate">
        Annual Interest Rate (%)
      </label>

      <input
        type="number"
        id="rate"
        value="7.1"
        min="0"
        step="0.01"
      >
    </div>

    <div class="input-group">
      <label for="years">
        Investment Period (Years)
      </label>

      <input
        type="number"
        id="years"
        value="15"
        min="1"
        max="50"
        step="1"
      >
    </div>

    <button onclick="calculatePPF()">
      Calculate PPF
    </button>

    <button
      class="clear"
      onclick="clearFields()"
    >
      Clear
    </button>

    <div class="result">

      <h3>PPF Result</h3>

      <div class="result-row">
        <span>Total Investment</span>
        <strong id="investmentResult">₹0</strong>
      </div>

      <div class="result-row">
        <span>Total Interest</span>
        <strong id="interestResult">₹0</strong>
      </div>

      <div class="result-row">
        <span>Maturity Amount</span>
        <strong class="maturity" id="maturityResult">₹0</strong>
      </div>

    </div>

    <div class="note">
      This is an estimate. Actual PPF interest rates and rules may change.
    </div>

  </div>

</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>

  function formatRupees(value) {
    return "₹" + Math.round(value).toLocaleString("en-IN");
  }


  function calculatePPF() {

    const yearlyInvestment =
      Number(
        document.getElementById("investment").value
      );

    const annualRate =
      Number(
        document.getElementById("rate").value
      );

    const years =
      Number(
        document.getElementById("years").value
      );


    if (
      !yearlyInvestment ||
      yearlyInvestment <= 0 ||
      annualRate < 0 ||
      !years ||
      years <= 0 ||
      years > 50
    ) {

      alert(
        "Please enter valid PPF details."
      );

      return;
    }


    const rate =
      annualRate / 100;

    let balance = 0;
    let totalInvestment = 0;


    /*
      Simplified annual calculation.
      Investment is assumed at the beginning
      of each year.
    */

    for (let year = 1; year <= years; year++) {

      balance += yearlyInvestment;

      totalInvestment += yearlyInvestment;

      balance =
        balance * (1 + rate);
    }


    const maturityAmount =
      balance;

    const totalInterest =
      maturityAmount - totalInvestment;


    document.getElementById("investmentResult").textContent =
      formatRupees(totalInvestment);

    document.getElementById("interestResult").textContent =
      formatRupees(totalInterest);

    document.getElementById("maturityResult").textContent =
      formatRupees(maturityAmount);
  }


  function clearFields() {

    document.getElementById("investment").value = "";

    document.getElementById("rate").value = "7.1";

    document.getElementById("years").value = "15";

    document.getElementById("investmentResult").textContent =
      "₹0";

    document.getElementById("interestResult").textContent =
      "₹0";

    document.getElementById("maturityResult").textContent =
      "₹0";
  }

</script>

</body>
</html>
