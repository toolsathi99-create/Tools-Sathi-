<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XML Formatter Online - Free XML Beautifier</title>

<meta name="description" content="Format and beautify XML code online for free. Make compressed or messy XML easier to read and edit.">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

.container{
    max-width:950px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 8px;
}

textarea{
    width:100%;
    min-height:300px;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-family:monospace;
    font-size:14px;
    resize:vertical;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:15px 0;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 18px;
    background:#2563eb;
    color:#fff;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.secondary{
    background:#555;
}

.danger{
    background:#dc2626;
}

.message{
    margin-top:12px;
    padding:10px;
    border-radius:7px;
    display:none;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

footer{
    text-align:center;
    margin-top:25px;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>XML Formatter</h1>

<p class="subtitle">
Beautify and format XML code online for free.
</p>

<div class="card">

<label for="xmlInput">Enter XML Code</label>

<textarea
id="xmlInput"
placeholder='<root><user><name>John</name><age>25</age></user></root>'
></textarea>

<div class="buttons">

<button onclick="formatXML()">
Format XML
</button>

<button class="secondary" onclick="copyXML()">
Copy
</button>

<button class="danger" onclick="clearAll()">
Clear
</button>

</div>

<label for="xmlOutput">Formatted XML</label>

<textarea
id="xmlOutput"
readonly
placeholder="Formatted XML will appear here..."
></textarea>

<div id="message" class="message"></div>

</div>

<footer>
© 2026 Tools-Sathi — Free Online Tools
</footer>

</div>

<script>

function formatXML(){

    const input =
        document.getElementById("xmlInput").value.trim();

    if(!input){

        showMessage(
            "Please enter XML code first.",
            "error"
        );

        return;
    }

    try{

        const parser = new DOMParser();

        const xml =
            parser.parseFromString(
                input,
                "application/xml"
            );

        const error =
            xml.querySelector("parsererror");

        if(error){
            throw new Error(
                "Invalid XML syntax."
            );
        }

        const serializer =
            new XMLSerializer();

        let raw =
            serializer.serializeToString(xml);

        /*
         * Add line breaks between tags.
         */
        raw = raw.replace(
            />\s*</g,
            "><"
        );

        const tokens =
            raw.split(/(<[^>]+>)/g)
               .filter(Boolean);

        let result = "";
        let indent = 0;

        tokens.forEach(function(token){

            token = token.trim();

            if(!token){
                return;
            }

            /*
             * Closing tag
             */
            if(/^<\/.+>/.test(token)){

                indent =
                    Math.max(0, indent - 1);

                result +=
                    "    ".repeat(indent) +
                    token +
                    "\n";

            /*
             * Opening tag
             */
            }else if(
                /^<[^!?][^>]*[^/]>/.
                test(token)
            ){

                result +=
                    "    ".repeat(indent) +
                    token +
                    "\n";

                indent++;

            /*
             * XML declaration, comments,
             * CDATA and self-closing tags
             */
            }else if(
                /^<\?/.test(token) ||
                /^<!--/.test(token) ||
                /^<!\[CDATA\[/.test(token) ||
                /\/>$/.test(token)
            ){

                result +=
                    "    ".repeat(indent) +
                    token +
                    "\n";

            }else{

                result +=
                    "    ".repeat(indent) +
                    token +
                    "\n";
            }
        });

        document.getElementById("xmlOutput").value =
            result.trim();

        showMessage(
            "✓ XML formatted successfully.",
            "success"
        );

    }catch(error){

        showMessage(
            "✗ " + error.message,
            "error"
        );
    }
}

function copyXML(){

    const output =
        document.getElementById("xmlOutput");

    if(!output.value.trim()){

        showMessage(
            "Please format XML first.",
            "error"
        );

        return;
    }

    navigator.clipboard.writeText(output.value)
        .then(function(){

            showMessage(
                "✓ XML copied to clipboard.",
                "success"
            );

        })
        .catch(function(){

            output.select();
            document.execCommand("copy");

            showMessage(
                "✓ XML copied to clipboard.",
                "success"
            );

        });
}

function clearAll(){

    document.getElementById("xmlInput").value = "";
    document.getElementById("xmlOutput").value = "";

    const message =
        document.getElementById("message");

    message.textContent = "";
    message.className = "message";
}

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;
    message.className =
        "message " + type;
}

</script>

</body>
</html>
