<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Average Calculator - ToolSathi</title>
  <meta name="description" content="Free online Average Calculator. Calculate the average of multiple numbers quickly and easily with ToolSathi.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      background: #eef4ff;
      border-radius: 8px;
      line-height: 1.8;
      font-size: 17px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online Average Calculator</p>
</header>

<div class="container">
  <div class="card">

    <h2>Average Calculator</h2>

    <label for="numbers">Enter Numbers</label>

    <textarea
      id="numbers"
      placeholder="Example: 10, 20, 30, 40, 50">
    </textarea>

    <button onclick="calculateAverage()">Calculate Average</button>

    <div class="result" id="result">
      Result will appear here
    </div>

  </div>
</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>
  function calculateAverage() {

    const input = document.getElementById("numbers").value.trim();
    const resultBox = document.getElementById("result");

    if (input === "") {
      resultBox.innerHTML = "Please enter some numbers.";
      return;
    }

    const values = input
      .split(/[\s,]+/)
      .filter(value => value !== "")
      .map(Number);

    if (values.some(value => !Number.isFinite(value))) {
      resultBox.innerHTML =
        "Please enter numbers only.";
      return;
    }

    const sum = values.reduce(
      (total, value) => total + value,
      0
    );

    const average = sum / values.length;

    resultBox.innerHTML = `
      Count: ${values.length}<br>
      Sum: ${sum}<br>
      <strong>Average: ${average.toFixed(2)}</strong>
    `;
  }
</script>

</body>
</html>
