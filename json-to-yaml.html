<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JSON to YAML Converter Online - Free</title>

<meta name="description" content="Convert JSON to YAML online for free. Easily transform JSON data into clean and readable YAML format.">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

.container{
    max-width:950px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 8px;
}

textarea{
    width:100%;
    min-height:280px;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-family:monospace;
    font-size:14px;
    resize:vertical;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:15px 0;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 18px;
    background:#2563eb;
    color:white;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.secondary{
    background:#555;
}

.danger{
    background:#dc2626;
}

.message{
    margin-top:12px;
    padding:10px;
    border-radius:7px;
    display:none;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

footer{
    text-align:center;
    margin-top:25px;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>JSON to YAML Converter</h1>

<p class="subtitle">
Convert JSON data into clean and readable YAML format.
</p>

<div class="card">

<label for="jsonInput">JSON Input</label>

<textarea
id="jsonInput"
placeholder='Paste JSON here...

Example:
{
  "name": "John",
  "age": 25,
  "active": true
}'></textarea>

<div class="buttons">

<button onclick="convertJSON()">
Convert to YAML
</button>

<button class="secondary" onclick="copyYAML()">
Copy YAML
</button>

<button class="danger" onclick="clearAll()">
Clear
</button>

</div>

<label for="yamlOutput">YAML Output</label>

<textarea
id="yamlOutput"
readonly
placeholder="YAML output will appear here..."
></textarea>

<div id="message" class="message"></div>

</div>

<footer>
© 2026 Tools-Sathi — Free Online Tools
</footer>

</div>

<script>

function yamlValue(value){

    if(value === null){
        return "null";
    }

    if(typeof value === "boolean"){
        return value ? "true" : "false";
    }

    if(typeof value === "number"){
        return String(value);
    }

    if(typeof value === "string"){

        if(
            value === "" ||
            /[:{}\[\],&*#?|\-<>=!%@`]/.test(value) ||
            /^\s|\s$/.test(value) ||
            /^(true|false|null|yes|no|on|off)$/i.test(value)
        ){
            return JSON.stringify(value);
        }

        return value;
    }

    return JSON.stringify(value);
}

function convertObject(obj, indent){

    let output = "";
    const space = " ".repeat(indent);

    if(Array.isArray(obj)){

        obj.forEach(function(item){

            if(
                typeof item === "object" &&
                item !== null
            ){

                output += space + "-\n";
                output += convertObject(item, indent + 2);

            }else{

                output +=
                    space +
                    "- " +
                    yamlValue(item) +
                    "\n";
            }
        });

        return output;
    }

    Object.keys(obj).forEach(function(key){

        const value = obj[key];

        const safeKey =
            /^[A-Za-z0-9_-]+$/.test(key)
                ? key
                : JSON.stringify(key);

        if(
            typeof value === "object" &&
            value !== null
        ){

            if(Array.isArray(value) &&
               value.length === 0){

                output +=
                    space +
                    safeKey +
                    ": []\n";

            }else if(
                !Array.isArray(value) &&
                Object.keys(value).length === 0
            ){

                output +=
                    space +
                    safeKey +
                    ": {}\n";

            }else{

                output +=
                    space +
                    safeKey +
                    ":\n";

                output +=
                    convertObject(
                        value,
                        indent + 2
                    );
            }

        }else{

            output +=
                space +
                safeKey +
                ": " +
                yamlValue(value) +
                "\n";
        }
    });

    return output;
}

function convertJSON(){

    const input =
        document.getElementById("jsonInput").value.trim();

    if(!input){

        showMessage(
            "Please enter JSON first.",
            "error"
        );

        return;
    }

    try{

        const parsed =
            JSON.parse(input);

        const yaml =
            convertObject(parsed, 0).trim();

        document.getElementById("yamlOutput").value =
            yaml;

        showMessage(
            "✓ JSON converted to YAML successfully.",
            "success"
        );

    }catch(error){

        showMessage(
            "✗ Invalid JSON: " + error.message,
            "error"
        );
    }
}

function copyYAML(){

    const output =
        document.getElementById("yamlOutput");

    if(!output.value.trim()){

        showMessage(
            "Please convert JSON first.",
            "error"
        );

        return;
    }

    navigator.clipboard.writeText(output.value)
        .then(function(){

            showMessage(
                "✓ YAML copied to clipboard.",
                "success"
            );

        })
        .catch(function(){

            output.select();
            document.execCommand("copy");

            showMessage(
                "✓ YAML copied to clipboard.",
                "success"
            );

        });
}

function clearAll(){

    document.getElementById("jsonInput").value = "";
    document.getElementById("yamlOutput").value = "";

    const message =
        document.getElementById("message");

    message.textContent = "";
    message.className = "message";
}

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;
    message.className =
        "message " + type;
}

</script>

</body>
</html>
