<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Word Counter - ToolSathi</title>

  <meta
    name="description"
    content="Free online Word Counter. Count words, characters, sentences and lines in your text with ToolSathi."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 700px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    textarea {
      width: 100%;
      min-height: 250px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      resize: vertical;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .stat {
      background: #eef4ff;
      padding: 15px 8px;
      border-radius: 8px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      color: #2563eb;
    }

    .stat span {
      font-size: 13px;
      color: #555;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online Word Counter</p>
</header>

<div class="container">

  <div class="card">

    <h2>Word Counter</h2>

    <textarea
      id="textInput"
      placeholder="Type or paste your text here..."
      oninput="countText()"
    ></textarea>

    <div class="stats">

      <div class="stat">
        <strong id="wordCount">0</strong>
        <span>Words</span>
      </div>

      <div class="stat">
        <strong id="characterCount">0</strong>
        <span>Characters</span>
      </div>

      <div class="stat">
        <strong id="characterNoSpaceCount">0</strong>
        <span>No Spaces</span>
      </div>

      <div class="stat">
        <strong id="sentenceCount">0</strong>
        <span>Sentences</span>
      </div>

    </div>

    <button onclick="clearText()">
      Clear Text
    </button>

  </div>

</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>

  function countText() {

    const text =
      document.getElementById("textInput").value;

    // Count words.
    const trimmedText = text.trim();

    const words = trimmedText === ""
      ? []
      : trimmedText.split(/\s+/);

    // Count sentences.
    const sentences = trimmedText === ""
      ? []
      : trimmedText
          .split(/[.!?]+/)
          .filter(sentence => sentence.trim() !== "");

    document.getElementById("wordCount").textContent =
      words.length;

    document.getElementById("characterCount").textContent =
      text.length;

    document.getElementById("characterNoSpaceCount").textContent =
      text.replace(/\s/g, "").length;

    document.getElementById("sentenceCount").textContent =
      sentences.length;
  }


  function clearText() {

    document.getElementById("textInput").value = "";

    countText();
  }

</script>

</body>
</html>
