<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSV to YAML Converter Online - Free</title>

<meta name="description" content="Convert CSV to YAML online for free. Transform CSV data into clean and readable YAML format instantly.">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

.container{
    max-width:950px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 8px;
}

textarea{
    width:100%;
    min-height:280px;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-family:monospace;
    font-size:14px;
    resize:vertical;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:15px 0;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 18px;
    background:#2563eb;
    color:#fff;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.secondary{
    background:#555;
}

.danger{
    background:#dc2626;
}

.message{
    margin-top:12px;
    padding:10px;
    border-radius:7px;
    display:none;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

footer{
    text-align:center;
    margin-top:25px;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>CSV to YAML Converter</h1>

<p class="subtitle">
Convert CSV data into clean YAML format online for free.
</p>

<div class="card">

<label for="csvInput">CSV Input</label>

<textarea
id="csvInput"
placeholder="name,age,city
John,25,Lucknow
Ali,22,Delhi"
></textarea>

<div class="buttons">

<button onclick="convertCSV()">
Convert to YAML
</button>

<button class="secondary" onclick="copyYAML()">
Copy YAML
</button>

<button class="danger" onclick="clearAll()">
Clear
</button>

</div>

<label for="yamlOutput">YAML Output</label>

<textarea
id="yamlOutput"
readonly
placeholder="YAML output will appear here..."
></textarea>

<div id="message" class="message"></div>

</div>

<footer>
© 2026 Tools-Sathi — Free Online Tools
</footer>

</div>

<script>

function parseCSVLine(line){

    const values = [];
    let current = "";
    let insideQuotes = false;

    for(let i = 0; i < line.length; i++){

        const char = line[i];

        if(char === '"'){

            if(
                insideQuotes &&
                line[i + 1] === '"'
            ){
                current += '"';
                i++;
            }else{
                insideQuotes = !insideQuotes;
            }

        }else if(char === "," && !insideQuotes){

            values.push(current.trim());
            current = "";

        }else{

            current += char;
        }
    }

    values.push(current.trim());

    return values;
}

function yamlValue(value){

    value = String(value);

    if(value === ""){
        return '""';
    }

    if(
        /^(true|false|null|yes|no|on|off)$/i.test(value) ||
        /^[-+]?\d+(\.\d+)?$/.test(value) ||
        /[:{}\[\],&*#?|\-<>=!%@`]/.test(value) ||
        /^\s|\s$/.test(value)
    ){
        return JSON.stringify(value);
    }

    return value;
}

function convertCSV(){

    const input =
        document.getElementById("csvInput").value.trim();

    if(!input){

        showMessage(
            "Please enter CSV data first.",
            "error"
        );

        return;
    }

    const lines =
        input.split(/\r?\n/)
        .filter(line => line.trim() !== "");

    if(lines.length < 2){

        showMessage(
            "CSV must contain a header and at least one data row.",
            "error"
        );

        return;
    }

    const headers =
        parseCSVLine(lines[0]);

    if(headers.length === 0){

        showMessage(
            "No CSV headers found.",
            "error"
        );

        return;
    }

    let yaml = "";

    for(let i = 1; i < lines.length; i++){

        const values =
            parseCSVLine(lines[i]);

        yaml += "-\n";

        headers.forEach(function(header,index){

            let key =
                header.trim()
                .replace(/[^a-zA-Z0-9_-]/g,"_");

            if(!key){
                key = "column_" + (index + 1);
            }

            const value =
                values[index] !== undefined
                    ? values[index]
                    : "";

            yaml +=
                "  " +
                key +
                ": " +
                yamlValue(value) +
                "\n";
        });
    }

    document.getElementById("yamlOutput").value =
        yaml.trim();

    showMessage(
        "✓ CSV converted to YAML successfully.",
        "success"
    );
}

function copyYAML(){

    const output =
        document.getElementById("yamlOutput");

    if(!output.value.trim()){

        showMessage(
            "Please convert CSV first.",
            "error"
        );

        return;
    }

    navigator.clipboard.writeText(output.value)
        .then(function(){

            showMessage(
                "✓ YAML copied to clipboard.",
                "success"
            );

        })
        .catch(function(){

            output.select();
            document.execCommand("copy");

            showMessage(
                "✓ YAML copied to clipboard.",
                "success"
            );
        });
}

function clearAll(){

    document.getElementById("csvInput").value = "";
    document.getElementById("yamlOutput").value = "";

    const message =
        document.getElementById("message");

    message.textContent = "";
    message.className = "message";
}

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;
    message.className =
        "message " + type;
}

</script>

</body>
</html>
