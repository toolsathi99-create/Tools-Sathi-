<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML Entity Encoder Decoder Online - Free</title>

<meta name="description" content="Encode and decode HTML entities online for free. Convert special characters to HTML entities and decode them instantly.">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

.container{
    max-width:950px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 8px;
}

textarea{
    width:100%;
    min-height:250px;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-family:monospace;
    font-size:14px;
    resize:vertical;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:15px 0;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 18px;
    background:#2563eb;
    color:#fff;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.secondary{
    background:#555;
}

.danger{
    background:#dc2626;
}

.message{
    margin-top:12px;
    padding:10px;
    border-radius:7px;
    display:none;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

footer{
    text-align:center;
    margin-top:25px;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>HTML Entity Encoder & Decoder</h1>

<p class="subtitle">
Encode special characters into HTML entities or decode them back to normal text.
</p>

<div class="card">

<label for="inputText">Input</label>

<textarea
id="inputText"
placeholder='Example: <div>Hello & welcome</div>'></textarea>

<div class="buttons">

<button onclick="encodeHTML()">
Encode HTML
</button>

<button onclick="decodeHTML()">
Decode HTML
</button>

<button class="secondary" onclick="copyOutput()">
Copy
</button>

<button class="danger" onclick="clearAll()">
Clear
</button>

</div>

<label for="outputText">Output</label>

<textarea
id="outputText"
readonly
placeholder="Result will appear here..."
></textarea>

<div id="message" class="message"></div>

</div>

<footer>
© 2026 Tools-Sathi — Free Online Tools
</footer>

</div>

<script>

function encodeHTML(){

    const input =
        document.getElementById("inputText").value;

    if(!input){

        showMessage(
            "Please enter text first.",
            "error"
        );

        return;
    }

    const textarea =
        document.createElement("textarea");

    textarea.textContent = input;

    document.getElementById("outputText").value =
        textarea.innerHTML;

    showMessage(
        "✓ HTML encoded successfully.",
        "success"
    );
}

function decodeHTML(){

    const input =
        document.getElementById("inputText").value;

    if(!input){

        showMessage(
            "Please enter HTML entities first.",
            "error"
        );

        return;
    }

    const textarea =
        document.createElement("textarea");

    textarea.innerHTML = input;

    document.getElementById("outputText").value =
        textarea.value;

    showMessage(
        "✓ HTML decoded successfully.",
        "success"
    );
}

function copyOutput(){

    const output =
        document.getElementById("outputText");

    if(!output.value){

        showMessage(
            "Please generate an output first.",
            "error"
        );

        return;
    }

    navigator.clipboard.writeText(output.value)
        .then(function(){

            showMessage(
                "✓ Output copied to clipboard.",
                "success"
            );

        })
        .catch(function(){

            output.select();
            document.execCommand("copy");

            showMessage(
                "✓ Output copied.",
                "success"
            );
        });
}

function clearAll(){

    document.getElementById("inputText").value = "";
    document.getElementById("outputText").value = "";

    const message =
        document.getElementById("message");

    message.textContent = "";
    message.className = "message";
}

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;
    message.className =
        "message " + type;
}

</script>

</body>
</html>
