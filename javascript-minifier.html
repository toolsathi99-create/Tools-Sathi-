<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JavaScript Minifier Online - Free JS Compressor</title>

<meta name="description" content="Minify JavaScript code online for free. Remove comments and unnecessary whitespace to make JavaScript code smaller.">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

.container{
    max-width:950px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

textarea{
    width:100%;
    min-height:320px;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-family:monospace;
    font-size:14px;
    resize:vertical;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:15px 0;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 18px;
    background:#2563eb;
    color:#fff;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.secondary{
    background:#555;
}

.danger{
    background:#dc2626;
}

.info{
    margin-top:15px;
    padding:12px;
    background:#f1f5f9;
    border-radius:7px;
    font-size:14px;
}

.message{
    margin-top:12px;
    padding:10px;
    border-radius:7px;
    display:none;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

footer{
    text-align:center;
    margin-top:25px;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>JavaScript Minifier</h1>

<p class="subtitle">
Minify and compress JavaScript code online for free.
</p>

<div class="card">

<label for="jsInput">Enter JavaScript Code</label>

<textarea
id="jsInput"
placeholder="Paste your JavaScript code here..."
></textarea>

<div class="buttons">

<button onclick="minifyJS()">
Minify JavaScript
</button>

<button class="secondary" onclick="copyJS()">
Copy
</button>

<button class="danger" onclick="clearAll()">
Clear
</button>

</div>

<label for="jsOutput">Minified JavaScript</label>

<textarea
id="jsOutput"
readonly
placeholder="Minified JavaScript will appear here..."
></textarea>

<div id="info" class="info">
Original size: 0 bytes | Minified size: 0 bytes | Saved: 0%
</div>

<div id="message" class="message"></div>

</div>

<footer>
© 2026 Tools-Sathi — Free Online Tools
</footer>

</div>

<script>

function minifyJS(){

    const input =
        document.getElementById("jsInput").value;

    if(!input.trim()){
        showMessage(
            "Please enter JavaScript code first.",
            "error"
        );
        return;
    }

    let js = input;

    /*
     * Remove block comments.
     */
    js = js.replace(
        /\/\*[\s\S]*?\*\//g,
        ""
    );

    /*
     * Remove single-line comments.
     * Lines beginning with // are removed.
     */
    js = js.replace(
        /^\s*\/\/.*$/gm,
        ""
    );

    /*
     * Collapse whitespace.
     */
    js = js.replace(
        /\s+/g,
        " "
    );

    /*
     * Remove unnecessary spaces around
     * common JavaScript operators and symbols.
     */
    js = js.replace(
        /\s*([{}()[\];,:?=+\-*\/<>!&|])\s*/g,
        "$1"
    );

    /*
     * Restore spaces required between
     * certain JavaScript keywords and identifiers.
     */
    js = js.replace(
        /\b(const|let|var|return|throw|new|typeof|void|delete|in|instanceof)\s*(?=[A-Za-z_$])/g,
        "$1 "
    );

    /*
     * Keep function keyword readable.
     */
    js = js.replace(
        /\bfunction\s*(?=[A-Za-z_$])/g,
        "function "
    );

    js = js.trim();

    document.getElementById("jsOutput").value =
        js;

    updateInfo(input, js);

    showMessage(
        "✓ JavaScript minified successfully.",
        "success"
    );
}

function updateInfo(original, minified){

    const originalSize =
        new Blob([original]).size;

    const minifiedSize =
        new Blob([minified]).size;

    let saved = 0;

    if(originalSize > 0){
        saved =
            ((originalSize - minifiedSize) /
            originalSize * 100).toFixed(1);
    }

    document.getElementById("info").textContent =
        "Original size: " +
        originalSize +
        " bytes | Minified size: " +
        minifiedSize +
        " bytes | Saved: " +
        saved +
        "%";
}

function copyJS(){

    const output =
        document.getElementById("jsOutput");

    if(!output.value.trim()){
        showMessage(
            "Please minify JavaScript first.",
            "error"
        );
        return;
    }

    navigator.clipboard.writeText(output.value)
        .then(function(){

            showMessage(
                "✓ Minified JavaScript copied.",
                "success"
            );

        })
        .catch(function(){

            output.select();
            document.execCommand("copy");

            showMessage(
                "✓ Minified JavaScript copied.",
                "success"
            );

        });
}

function clearAll(){

    document.getElementById("jsInput").value = "";
    document.getElementById("jsOutput").value = "";

    document.getElementById("info").textContent =
        "Original size: 0 bytes | Minified size: 0 bytes | Saved: 0%";

    const message =
        document.getElementById("message");

    message.textContent = "";
    message.className = "message";
}

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;
    message.className =
        "message " + type;
}

</script>

</body>
  </html>
