<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Date to Days Calculator - Free Online Tool</title>

<meta name="description" content="Calculate the exact number of days between two dates with this free online Date to Days Calculator.">
<meta name="keywords" content="date to days calculator, days between dates, calculate days between dates, date difference in days">

<style>
*{box-sizing:border-box}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:20px;
    color:#222;
}

.container{
    max-width:650px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-top:0;
}

p{
    line-height:1.6;
    color:#555;
}

label{
    display:block;
    font-weight:bold;
    margin-top:18px;
}

input{
    width:100%;
    padding:12px;
    margin-top:7px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    margin-top:22px;
    border:0;
    border-radius:7px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.result{
    margin-top:20px;
    padding:18px;
    background:#eef5ff;
    border-radius:8px;
    line-height:1.8;
}

.error{
    color:#c00;
}
</style>
</head>

<body>

<div class="container">

<h1>Date to Days Calculator</h1>

<p>
Find the exact number of days between any two dates. You can also see
the approximate number of weeks, months and years.
</p>

<label for="startDate">Start Date</label>
<input type="date" id="startDate">

<label for="endDate">End Date</label>
<input type="date" id="endDate">

<button onclick="calculateDays()">Calculate Days</button>

<div class="result" id="result">
Your result will appear here.
</div>

</div>

<script>

function calculateDays(){

    const startValue=document.getElementById("startDate").value;
    const endValue=document.getElementById("endDate").value;
    const result=document.getElementById("result");

    if(!startValue || !endValue){
        result.innerHTML='<span class="error">Please select both dates.</span>';
        return;
    }

    const start=new Date(startValue+"T00:00:00");
    const end=new Date(endValue+"T00:00:00");

    if(end < start){
        result.innerHTML='<span class="error">End date must be after the start date.</span>';
        return;
    }

    const millisecondsPerDay=1000*60*60*24;

    const difference=end.getTime()-start.getTime();

    const days=Math.round(difference/millisecondsPerDay);
    const weeks=(days/7).toFixed(2);
    const months=(days/30.436875).toFixed(2);
    const years=(days/365.2425).toFixed(2);

    result.innerHTML=
        "<strong>Days:</strong> "+days+
        "<br><strong>Weeks:</strong> "+weeks+
        "<br><strong>Approx. Months:</strong> "+months+
        "<br><strong>Approx. Years:</strong> "+years;

}

</script>

</body>
  </html>
