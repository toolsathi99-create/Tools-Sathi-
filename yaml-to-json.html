<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YAML to JSON Converter Online - Free</title>

<meta name="description" content="Convert YAML to JSON online for free. Transform YAML data into clean, readable and properly formatted JSON.">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

.container{
    max-width:950px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 8px;
}

textarea{
    width:100%;
    min-height:280px;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-family:monospace;
    font-size:14px;
    resize:vertical;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:15px 0;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 18px;
    background:#2563eb;
    color:#fff;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.secondary{
    background:#555;
}

.danger{
    background:#dc2626;
}

.message{
    margin-top:12px;
    padding:10px;
    border-radius:7px;
    display:none;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

footer{
    text-align:center;
    margin-top:25px;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>YAML to JSON Converter</h1>

<p class="subtitle">
Convert YAML data to formatted JSON online for free.
</p>

<div class="card">

<label for="yamlInput">YAML Input</label>

<textarea
id="yamlInput"
placeholder="name: John
age: 25
active: true
city: Lucknow"
></textarea>

<div class="buttons">

<button onclick="convertYAML()">
Convert to JSON
</button>

<button class="secondary" onclick="copyJSON()">
Copy JSON
</button>

<button class="danger" onclick="clearAll()">
Clear
</button>

</div>

<label for="jsonOutput">JSON Output</label>

<textarea
id="jsonOutput"
readonly
placeholder="JSON output will appear here..."
></textarea>

<div id="message" class="message"></div>

</div>

<footer>
© 2026 Tools-Sathi — Free Online Tools
</footer>

</div>

<script>

function parseValue(value){

    value = value.trim();

    if(value === ""){
        return "";
    }

    if(
        (value.startsWith('"') && value.endsWith('"')) ||
        (value.startsWith("'") && value.endsWith("'"))
    ){
        return value.slice(1,-1);
    }

    if(value === "true"){
        return true;
    }

    if(value === "false"){
        return false;
    }

    if(value === "null"){
        return null;
    }

    if(!isNaN(value) && value !== ""){
        return Number(value);
    }

    if(value.startsWith("[") && value.endsWith("]")){

        try{
            return JSON.parse(
                value.replace(/'/g,'"')
            );
        }catch(e){}
    }

    return value;
}

function convertYAML(){

    const input =
        document.getElementById("yamlInput").value.trim();

    if(!input){

        showMessage(
            "Please enter YAML first.",
            "error"
        );

        return;
    }

    try{

        const lines =
            input.split(/\r?\n/);

        const result = {};

        lines.forEach(function(line){

            const trimmed = line.trim();

            if(!trimmed || trimmed.startsWith("#")){
                return;
            }

            const colon = trimmed.indexOf(":");

            if(colon === -1){
                throw new Error(
                    "Invalid YAML line: " + trimmed
                );
            }

            const key =
                trimmed.substring(0,colon).trim();

            const value =
                trimmed.substring(colon + 1).trim();

            if(!key){
                throw new Error("Missing key.");
            }

            result[key] = parseValue(value);
        });

        document.getElementById("jsonOutput").value =
            JSON.stringify(result,null,4);

        showMessage(
            "✓ YAML converted to JSON successfully.",
            "success"
        );

    }catch(error){

        showMessage(
            "✗ Unable to parse YAML: " + error.message,
            "error"
        );
    }
}

function copyJSON(){

    const output =
        document.getElementById("jsonOutput");

    if(!output.value.trim()){

        showMessage(
            "Please convert YAML first.",
            "error"
        );

        return;
    }

    navigator.clipboard.writeText(output.value)
        .then(function(){

            showMessage(
                "✓ JSON copied to clipboard.",
                "success"
            );

        })
        .catch(function(){

            output.select();
            document.execCommand("copy");

            showMessage(
                "✓ JSON copied to clipboard.",
                "success"
            );

        });
}

function clearAll(){

    document.getElementById("yamlInput").value = "";
    document.getElementById("jsonOutput").value = "";

    const message =
        document.getElementById("message");

    message.textContent = "";
    message.className = "message";
}

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;
    message.className =
        "message " + type;
}

</script>

</body>
</html>
