<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSV to JSON Converter Online - Free</title>
<meta name="description" content="Convert TSV data to JSON online for free. Transform tab-separated values into formatted JSON instantly.">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

.container{
    max-width:950px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 8px;
}

textarea{
    width:100%;
    min-height:280px;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-family:monospace;
    font-size:14px;
    resize:vertical;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:15px 0;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 18px;
    background:#2563eb;
    color:#fff;
    font-size:15px;
    cursor:pointer;
}

.secondary{background:#555}
.danger{background:#dc2626}

button:hover{
    opacity:.9;
}

.message{
    margin-top:12px;
    padding:10px;
    border-radius:7px;
    display:none;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

footer{
    text-align:center;
    margin-top:25px;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>TSV to JSON Converter</h1>

<p class="subtitle">
Convert tab-separated data into formatted JSON online for free.
</p>

<div class="card">

<label for="tsvInput">TSV Input</label>

<textarea id="tsvInput"
placeholder="name	age	city
John	25	Lucknow
Ali	22	Delhi"></textarea>

<div class="buttons">

<button onclick="convertTSV()">
Convert to JSON
</button>

<button class="secondary" onclick="copyJSON()">
Copy JSON
</button>

<button class="danger" onclick="clearAll()">
Clear
</button>

</div>

<label for="jsonOutput">JSON Output</label>

<textarea id="jsonOutput"
readonly
placeholder="JSON output will appear here..."></textarea>

<div id="message" class="message"></div>

</div>

<footer>
© 2026 Tools-Sathi — Free Online Tools
</footer>

</div>

<script>

function convertTSV(){

    const input =
        document.getElementById("tsvInput").value.trim();

    if(!input){
        showMessage(
            "Please enter TSV data first.",
            "error"
        );
        return;
    }

    const lines =
        input.split(/\r?\n/)
             .filter(line => line.trim() !== "");

    if(lines.length < 2){
        showMessage(
            "TSV must contain a header and at least one data row.",
            "error"
        );
        return;
    }

    const headers =
        lines[0].split("\t").map(h => h.trim());

    if(headers.some(h => !h)){
        showMessage(
            "Header names cannot be empty.",
            "error"
        );
        return;
    }

    const result = [];

    for(let i = 1; i < lines.length; i++){

        const values = lines[i].split("\t");
        const row = {};

        headers.forEach(function(header,index){

            row[header] =
                values[index] !== undefined
                    ? values[index].trim()
                    : "";
        });

        result.push(row);
    }

    document.getElementById("jsonOutput").value =
        JSON.stringify(result,null,2);

    showMessage(
        "✓ TSV converted to JSON successfully.",
        "success"
    );
}

function copyJSON(){

    const output =
        document.getElementById("jsonOutput");

    if(!output.value.trim()){
        showMessage(
            "Please convert TSV first.",
            "error"
        );
        return;
    }

    navigator.clipboard.writeText(output.value)
        .then(function(){

            showMessage(
                "✓ JSON copied to clipboard.",
                "success"
            );

        })
        .catch(function(){

            output.select();
            document.execCommand("copy");

            showMessage(
                "✓ JSON copied to clipboard.",
                "success"
            );
        });
}

function clearAll(){

    document.getElementById("tsvInput").value = "";
    document.getElementById("jsonOutput").value = "";

    const message =
        document.getElementById("message");

    message.textContent = "";
    message.className = "message";
}

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;
    message.className =
        "message " + type;
}

</script>

</body>
  </html>
