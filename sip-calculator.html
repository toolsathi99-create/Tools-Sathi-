<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SIP Calculator - ToolSathi</title>

  <meta
    name="description"
    content="Free online SIP Calculator. Calculate estimated SIP returns, total investment and future value easily with ToolSathi."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 650px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .clear {
      background: #555;
      margin-top: 12px;
    }

    .clear:hover {
      background: #333;
    }

    .result {
      margin-top: 22px;
      padding: 20px;
      background: #eef4ff;
      border-radius: 10px;
    }

    .result h3 {
      text-align: center;
      margin-top: 0;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #dbe4f0;
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      color: #2563eb;
    }

    .note {
      margin-top: 18px;
      font-size: 13px;
      color: #666;
      line-height: 1.5;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online SIP Calculator</p>
</header>

<div class="container">

  <div class="card">

    <h2>SIP Calculator</h2>

    <div class="input-group">
      <label for="monthlyInvestment">
        Monthly Investment (₹)
      </label>

      <input
        type="number"
        id="monthlyInvestment"
        placeholder="Example: 5000"
        min="1"
        step="1"
      >
    </div>

    <div class="input-group">
      <label for="returnRate">
        Expected Annual Return (%)
      </label>

      <input
        type="number"
        id="returnRate"
        placeholder="Example: 12"
        min="0"
        step="0.01"
      >
    </div>

    <div class="input-group">
      <label for="years">
        Investment Duration (Years)
      </label>

      <input
        type="number"
        id="years"
        placeholder="Example: 10"
        min="1"
        step="1"
      >
    </div>

    <button onclick="calculateSIP()">
      Calculate SIP
    </button>

    <button
      class="clear"
      onclick="clearFields()"
    >
      Clear
    </button>

    <div class="result" id="result">

      <h3>SIP Result</h3>

      <div class="result-row">
        <span>Total Investment</span>
        <strong id="invested">₹0</strong>
      </div>

      <div class="result-row">
        <span>Estimated Returns</span>
        <strong id="returns">₹0</strong>
      </div>

      <div class="result-row">
        <span>Total Value</span>
        <strong class="total" id="total">₹0</strong>
      </div>

    </div>

    <div class="note">
      SIP calculations are estimates based on the expected return entered.
      Actual market returns can vary.
    </div>

  </div>

</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>

  function formatRupees(value) {

    return "₹" +
      Math.round(value).toLocaleString("en-IN");
  }


  function calculateSIP() {

    const monthly =
      Number(
        document.getElementById("monthlyInvestment").value
      );

    const annualRate =
      Number(
        document.getElementById("returnRate").value
      );

    const years =
      Number(
        document.getElementById("years").value
      );


    if (
      !monthly ||
      monthly <= 0 ||
      annualRate < 0 ||
      !years ||
      years <= 0
    ) {

      alert(
        "Please enter valid investment, return rate and duration."
      );

      return;
    }


    const months =
      years * 12;


    /*
      Monthly rate is derived from the annual
      expected return.
    */

    const monthlyRate =
      Math.pow(
        1 + annualRate / 100,
        1 / 12
      ) - 1;


    let futureValue;


    if (monthlyRate === 0) {

      futureValue =
        monthly * months;

    } else {

      futureValue =
        monthly *
        (
          (Math.pow(1 + monthlyRate, months) - 1)
          / monthlyRate
        ) *
        (1 + monthlyRate);
    }


    const totalInvestment =
      monthly * months;

    const estimatedReturns =
      futureValue - totalInvestment;


    document.getElementById("invested").textContent =
      formatRupees(totalInvestment);

    document.getElementById("returns").textContent =
      formatRupees(estimatedReturns);

    document.getElementById("total").textContent =
      formatRupees(futureValue);
  }


  function clearFields() {

    document.getElementById("monthlyInvestment").value = "";

    document.getElementById("returnRate").value = "";

    document.getElementById("years").value = "";

    document.getElementById("invested").textContent =
      "₹0";

    document.getElementById("returns").textContent =
      "₹0";

    document.getElementById("total").textContent =
      "₹0";
  }

</script>

</body>
        </html>
