<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ratio Calculator - ToolSathi</title>
  <meta name="description" content="Free online Ratio Calculator. Simplify ratios and calculate equivalent ratios easily with ToolSathi.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      background: #eef4ff;
      border-radius: 8px;
      line-height: 1.8;
      font-size: 17px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }

    @media (max-width: 500px) {
      .inputs {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online Ratio Calculator</p>
</header>

<div class="container">
  <div class="card">

    <h2>Ratio Calculator</h2>

    <div class="inputs">

      <div>
        <label for="first">First Number</label>
        <input type="number" id="first" placeholder="Example: 20">
      </div>

      <div>
        <label for="second">Second Number</label>
        <input type="number" id="second" placeholder="Example: 30">
      </div>

    </div>

    <button onclick="calculateRatio()">Calculate Ratio</button>

    <div class="result" id="result">
      Result will appear here
    </div>

  </div>
</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>
  function gcd(a, b) {
    a = Math.abs(a);
    b = Math.abs(b);

    while (b !== 0) {
      const temp = b;
      b = a % b;
      a = temp;
    }

    return a;
  }

  function calculateRatio() {
    const first = Number(document.getElementById("first").value);
    const second = Number(document.getElementById("second").value);
    const resultBox = document.getElementById("result");

    if (
      !Number.isFinite(first) ||
      !Number.isFinite(second) ||
      first <= 0 ||
      second <= 0
    ) {
      resultBox.innerHTML =
        "Please enter two positive numbers.";
      return;
    }

    const divisor = gcd(first, second);

    const simpleFirst = first / divisor;
    const simpleSecond = second / divisor;

    resultBox.innerHTML = `
      Original Ratio: ${first} : ${second}<br>
      <strong>Simplified Ratio: ${simpleFirst} : ${simpleSecond}</strong>
    `;
  }
</script>

</body>
</html>
