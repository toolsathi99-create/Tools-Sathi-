<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Days to Date Calculator - ToolSathi</title>

  <meta
    name="description"
    content="Free online Add Days to Date Calculator. Add or subtract days from any date quickly with ToolSathi."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .info {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
    }

    button {
      width: 100%;
      margin-top: 5px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .clear {
      background: #555;
      margin-top: 12px;
    }

    .clear:hover {
      background: #333;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      background: #eef4ff;
      border-radius: 10px;
      text-align: center;
      line-height: 1.7;
    }

    .result strong {
      display: block;
      font-size: 25px;
      color: #2563eb;
      margin-bottom: 5px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online Add Days to Date Calculator</p>
</header>

<div class="container">

  <div class="card">

    <h2>Add Days to Date</h2>

    <div class="info">
      Enter a date and number of days.
      Use a negative number to subtract days.
    </div>

    <div class="input-group">

      <label for="dateInput">
        Select Date
      </label>

      <input
        type="date"
        id="dateInput"
      >

    </div>

    <div class="input-group">

      <label for="daysInput">
        Number of Days
      </label>

      <input
        type="number"
        id="daysInput"
        placeholder="Example: 30"
        step="1"
      >

    </div>

    <button onclick="calculateDate()">
      Calculate Date
    </button>

    <button
      class="clear"
      onclick="clearFields()"
    >
      Clear
    </button>

    <div class="result" id="result">
      Enter a date and number of days.
    </div>

  </div>

</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>

  function calculateDate() {

    const dateValue =
      document.getElementById("dateInput").value;

    const daysValue =
      document.getElementById("daysInput").value;

    const result =
      document.getElementById("result");

    if (!dateValue || daysValue === "") {

      result.innerHTML =
        "Please enter both a date and number of days.";

      return;
    }

    const days = Number(daysValue);

    if (!Number.isInteger(days)) {

      result.innerHTML =
        "Please enter a whole number of days.";

      return;
    }

    /*
      Use UTC to avoid timezone-related date shifting.
    */

    const date =
      new Date(dateValue + "T00:00:00Z");

    date.setUTCDate(
      date.getUTCDate() + days
    );

    const year =
      date.getUTCFullYear();

    const month =
      String(date.getUTCMonth() + 1).padStart(2, "0");

    const day =
      String(date.getUTCDate()).padStart(2, "0");

    const resultDate =
      `${year}-${month}-${day}`;

    const formatted =
      date.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "long",
        year: "numeric",
        timeZone: "UTC"
      });

    result.innerHTML = `
      <strong>${formatted}</strong>
      Result Date: ${resultDate}
    `;
  }


  function clearFields() {

    document.getElementById("dateInput").value = "";

    document.getElementById("daysInput").value = "";

    document.getElementById("result").innerHTML =
      "Enter a date and number of days.";
  }

</script>

</body>
</html>
