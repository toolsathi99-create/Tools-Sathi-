<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JSON Formatter - ToolSathi</title>

  <meta
    name="description"
    content="Free online JSON Formatter and Validator. Format, beautify and validate JSON data quickly with ToolSathi."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 800px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      font-family: monospace;
      line-height: 1.6;
      resize: vertical;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    button {
      margin-top: 15px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .copy {
      background: #16a34a;
    }

    .copy:hover {
      background: #15803d;
    }

    .clear {
      background: #555;
    }

    .clear:hover {
      background: #333;
    }

    .result {
      margin-top: 20px;
    }

    .result h3 {
      margin-bottom: 8px;
    }

    #output {
      width: 100%;
      min-height: 220px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f8fafc;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
    }

    #message {
      margin-top: 12px;
      text-align: center;
      min-height: 22px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }

    @media (max-width: 600px) {
      .buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online JSON Formatter & Validator</p>
</header>

<div class="container">

  <div class="card">

    <h2>JSON Formatter</h2>

    <textarea
      id="jsonInput"
      placeholder='Paste JSON here...

Example:
{"name":"ToolSathi","free":true}'
    ></textarea>

    <div class="buttons">

      <button onclick="formatJSON()">
        Format JSON
      </button>

      <button
        class="copy"
        onclick="copyResult()"
      >
        Copy Result
      </button>

      <button
        class="clear"
        onclick="clearFields()"
      >
        Clear
      </button>

    </div>

    <div class="result">

      <h3>Formatted Result</h3>

      <div id="output">
        Formatted JSON will appear here.
      </div>

      <div id="message"></div>

    </div>

  </div>

</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>

  function formatJSON() {

    const input =
      document.getElementById("jsonInput").value.trim();

    const output =
      document.getElementById("output");

    const message =
      document.getElementById("message");

    if (input === "") {

      output.textContent =
        "Please enter JSON data.";

      message.textContent = "";

      return;
    }

    try {

      const parsed =
        JSON.parse(input);

      const formatted =
        JSON.stringify(parsed, null, 2);

      output.textContent =
        formatted;

      message.textContent =
        "Valid JSON ✓";

    } catch (error) {

      output.textContent =
        "Invalid JSON.";

      message.textContent =
        "Error: " + error.message;
    }
  }


  async function copyResult() {

    const output =
      document.getElementById("output").textContent;

    const message =
      document.getElementById("message");

    if (
      !output ||
      output === "Formatted JSON will appear here." ||
      output === "Please enter JSON data." ||
      output === "Invalid JSON."
    ) {

      message.textContent =
        "Format valid JSON first.";

      return;
    }

    try {

      await navigator.clipboard.writeText(output);

      message.textContent =
        "Formatted JSON copied.";

    } catch (error) {

      message.textContent =
        "Copy failed. Please copy it manually.";
    }
  }


  function clearFields() {

    document.getElementById("jsonInput").value = "";

    document.getElementById("output").textContent =
      "Formatted JSON will appear here.";

    document.getElementById("message").textContent = "";
  }

</script>

</body>
</html>
