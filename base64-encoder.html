<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Base64 Encoder - ToolSathi</title>

  <meta
    name="description"
    content="Free online Base64 Encoder. Encode text into Base64 quickly and easily with ToolSathi."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 700px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      resize: vertical;
      line-height: 1.6;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .copy {
      background: #16a34a;
    }

    .copy:hover {
      background: #15803d;
    }

    .clear {
      background: #555;
    }

    .clear:hover {
      background: #333;
    }

    .result {
      margin-top: 20px;
    }

    .result h3 {
      margin-bottom: 8px;
    }

    #output {
      width: 100%;
      min-height: 150px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f8fafc;
      font-family: monospace;
      font-size: 15px;
      line-height: 1.6;
      word-break: break-all;
      white-space: pre-wrap;
    }

    #message {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      min-height: 20px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online Base64 Encoder</p>
</header>

<div class="container">

  <div class="card">

    <h2>Base64 Encoder</h2>

    <textarea
      id="textInput"
      placeholder="Type or paste text here..."
    ></textarea>

    <button onclick="encodeBase64()">
      Encode to Base64
    </button>

    <div class="result">

      <h3>Encoded Result</h3>

      <div id="output">
        Your Base64 encoded text will appear here.
      </div>

      <button
        class="copy"
        onclick="copyResult()"
      >
        Copy Result
      </button>

      <button
        class="clear"
        onclick="clearFields()"
      >
        Clear
      </button>

      <div id="message"></div>

    </div>

  </div>

</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>

  /*
    This function supports Unicode text such as
    English, Hindi and other languages.
  */

  function encodeBase64() {

    const text =
      document.getElementById("textInput").value;

    const output =
      document.getElementById("output");

    const message =
      document.getElementById("message");

    if (text === "") {

      output.textContent =
        "Please enter some text.";

      message.textContent = "";

      return;
    }

    try {

      const bytes =
        new TextEncoder().encode(text);

      let binary = "";

      for (const byte of bytes) {
        binary += String.fromCharCode(byte);
      }

      const encoded =
        btoa(binary);

      output.textContent =
        encoded;

      message.textContent =
        "Text encoded successfully.";

    } catch (error) {

      output.textContent =
        "Unable to encode the text.";

      message.textContent = "";
    }
  }


  async function copyResult() {

    const output =
      document.getElementById("output").textContent;

    const message =
      document.getElementById("message");

    if (
      !output ||
      output === "Your Base64 encoded text will appear here." ||
      output === "Please enter some text."
    ) {

      message.textContent =
        "Generate an encoded result first.";

      return;
    }

    try {

      await navigator.clipboard.writeText(output);

      message.textContent =
        "Result copied to clipboard.";

    } catch (error) {

      message.textContent =
        "Copy failed. Please copy the result manually.";
    }
  }


  function clearFields() {

    document.getElementById("textInput").value = "";

    document.getElementById("output").textContent =
      "Your Base64 encoded text will appear here.";

    document.getElementById("message").textContent = "";
  }

</script>

</body>
  </html>
