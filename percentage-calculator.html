<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Percentage Calculator - ToolSathi</title>
  <meta name="description" content="Free online Percentage Calculator. Calculate percentages quickly and easily with ToolSathi.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      font-size: 16px;
    }

    .container {
      max-width: 600px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #eef4ff;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ToolSathi</h1>
  <p>Free Online Percentage Calculator</p>
</header>

<div class="container">
  <div class="card">

    <h2>Percentage Calculator</h2>

    <label for="percentage">Percentage (%)</label>
    <input type="number" id="percentage" placeholder="Example: 20">

    <label for="number">Number</label>
    <input type="number" id="number" placeholder="Example: 500">

    <button onclick="calculatePercentage()">Calculate</button>

    <div class="result" id="result">
      Result will appear here
    </div>

  </div>
</div>

<footer>
  © 2026 ToolSathi
</footer>

<script>
  function calculatePercentage() {
    const percentage = parseFloat(
      document.getElementById("percentage").value
    );

    const number = parseFloat(
      document.getElementById("number").value
    );

    const resultBox = document.getElementById("result");

    if (isNaN(percentage) || isNaN(number)) {
      resultBox.innerHTML = "Please enter both values.";
      return;
    }

    const result = (percentage / 100) * number;

    resultBox.innerHTML =
      percentage + "% of " + number + " = " + result;
  }
</script>

</body>
</html>
